<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Song Game - Lost in Translation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <div class="title-row">
          <p class="eyebrow">Song Game</p>
          <button class="button ghost small" id="openAddSong" type="button">Add song</button>
        </div>
        <h1>Lost in Translation</h1>
        <p class="subtitle">Read the translation, sing it like the original song.</p>
      </div>
    </header>

    <main class="game">
      <section class="lyrics-card">
        <div class="sticky-bar">
          <div class="sticky-row sticky-top">
            <h2>Sing the lyrics</h2>
            <p class="turn-main team-a" id="turnMain">Team A (0) turn</p>
          </div>
          <div class="sticky-row sticky-bottom">
            <div class="row-left">
              <p class="song-count" id="roundCount">Song 1 of 5</p>
              <button class="icon-button icon-plain" id="copyLyrics" type="button" aria-label="Copy lyrics">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H10V7h9v14z" />
                </svg>
              </button>
            </div>
            <div class="row-right">
              <p class="turn-sub team-b" id="turnSub">Team B (0)</p>
              <button class="icon-button icon-plain" id="openEditScores" type="button" aria-label="Edit team scores">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l8.81-8.8.92.91-8.8 8.81zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.82 1.82 3.75 3.75 1.82-1.82z\" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="lyrics" id="lyrics"></div>
        <p class="status" id="statusMessage"></p>
      </section>
    </main>

    <div class="bottom-bar">
      <div class="bottom-actions">
        <div class="hint-wrap">
          <button class="button ghost" id="revealToggle" type="button">Hint: song name</button>
          <button class="text-link is-hidden" id="hideHint" type="button">Hide</button>
        </div>
        <button class="button highlight" id="endRound" type="button">End round</button>
      </div>
      <p class="bottom-note">Created by Mukul &amp; Abhijith</p>
    </div>

    <div class="modal" id="roundModal" aria-hidden="true">
      <div class="modal-card">
        <h3>Who won the round?</h3>
        <div class="winner-grid">
          <button class="button winner-button" data-winner="0" type="button">Team A</button>
          <button class="button winner-button" data-winner="1" type="button">Team B</button>
          <button class="button winner-button selected" data-winner="none" type="button">No one</button>
        </div>
        <button class="button next-song" id="confirmRound" type="button">Next song</button>
        <button class="text-button" id="closeRound" type="button">Back</button>
      </div>
    </div>

    <div class="modal" id="editScoresModal" aria-hidden="true">
      <div class="modal-card">
        <h3>Edit team scores</h3>
        <label class="field">
          <span>Team A name</span>
          <input type="text" id="editTeamAName" />
        </label>
        <label class="field">
          <span>Team A score</span>
          <input type="number" id="editTeamAScore" />
        </label>
        <label class="field">
          <span>Team B name</span>
          <input type="text" id="editTeamBName" />
        </label>
        <label class="field">
          <span>Team B score</span>
          <input type="number" id="editTeamBScore" />
        </label>
        <div class="modal-actions">
          <button class="button ghost" id="closeEditScores" type="button">Close</button>
          <button class="button primary" id="saveEditScores" type="button">Submit</button>
        </div>
      </div>
    </div>

    <div class="modal" id="addSongModal" aria-hidden="true">
      <div class="modal-card">
        <h3>Add a song</h3>
        <p class="modal-note">20 default songs are already loaded.</p>
        <label class="field">
          <span>Song title</span>
          <input type="text" id="newTitle" placeholder="Song title" />
        </label>
        <label class="field">
          <span>Translated lyrics</span>
          <textarea id="newTranslation" rows="5" placeholder="Paste the English translation here"></textarea>
        </label>
        <div class="modal-actions">
          <button class="button ghost" id="closeAddSong" type="button">Close</button>
          <button class="button primary" id="addSong" type="button">Submit</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="main.js"></script>
  </body>
</html>
